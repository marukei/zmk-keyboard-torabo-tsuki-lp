# Fork-local Kconfig for both halves of torabo-tsuki LP.
# ZMK v0.3 picks up config/torabo_tsuki_lp.conf for both torabo_tsuki_lp_left
# and _right because the name matches the shield directory name / the shield
# name prefix; keeping it here means upstream syncs of the shield files do not
# conflict with it textually.
#
# NOTE: this file is merged *before* the shield's .conf, so if upstream ever
# sets the same symbol there, upstream's value wins. If upstream renames the
# shields so that neither name matches any more, this file stops being read
# without a build error. After syncing, check that the CI build log still
# lists this file and the symbol.

# Connection stability tweak planned to become default (v0.3: disables 2M PHY)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
