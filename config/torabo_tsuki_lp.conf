# Fork-local Kconfig for both halves of torabo-tsuki LP.
# ZMK reads config/torabo_tsuki_lp.conf for both torabo_tsuki_lp_left and
# _right in addition to the shield's own .conf; keeping it here means upstream
# syncs of the shield files never touch this setting.

# Connection stability tweak planned to become default (v0.3: disables 2M PHY)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
